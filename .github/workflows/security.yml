# Scanning that complements the per-push checks in ci.yml.
#
# ci.yml already runs Bandit and pip-audit on every push. This workflow adds the
# two things those cannot see — credentials buried in history, and CVEs in the
# base image — and runs weekly so newly disclosed vulnerabilities surface even
# when nothing in the repository changes.
#
# CodeQL is deliberately absent: this repository uses GitHub's *default* code
# scanning setup, and default setup rejects SARIF uploaded by an advanced
# workflow configuration ("CodeQL analyses from advanced configurations cannot
# be processed when the default setup is enabled"). Adding a CodeQL job here
# would analyse the code and then fail at upload, every run. To customise the
# query suite, switch code scanning to advanced setup in the repository's
# Security settings first, then add the job back.
name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a credential that was committed and later amended away
          # is still leaked, so scanning only the tip would miss the case that
          # matters most.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t jmi-platform:scan .

      - name: Trivy (OS and library vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jmi-platform:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
