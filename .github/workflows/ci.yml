name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The pipeline only reads the checkout.  Any job needing more asks for it
# explicitly at the job level.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy (type-check)
        run: mypy

      - name: Pytest (with coverage)
        env:
          JMI_SECRET_KEY: ci-secret-key-not-used-in-production
        run: pytest --cov=jmi --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Build image & run the hardened stack
    runs-on: ubuntu-latest
    needs: quality
    # Job-scoped rather than per-step: compose interpolates these on *every*
    # invocation, so the teardown and log-dump steps need them too or they fail
    # on a missing variable instead of doing their job.
    env:
      JMI_SECRET_KEY: ci-only-secret-key-long-enough-to-pass-validation
      JMI_ADMIN_EMAIL: ci@example.org
      JMI_ADMIN_PASSWORD: ci-only-admin-password
      POSTGRES_PASSWORD: ci-only-postgres-password
      REDIS_PASSWORD: ci-only-redis-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t jmi-platform:ci .

      # The compose stack runs the API read-only, with every capability dropped
      # and its writable paths on tmpfs. That is exactly the kind of hardening
      # that looks fine in review and fails at runtime, so the stack is actually
      # started and served a request rather than merely built.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: The API answers on a read-only filesystem
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error "http://localhost:8000/api/v1/jobs?limit=1" > /dev/null

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and security tooling
        run: |
          # setuptools is preinstalled on the runner and has had CVEs of its
          # own; pip-audit sees the whole environment, so upgrade it here
          # rather than let the runner's build tooling fail the audit.
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install bandit pip-audit

      - name: Bandit (static analysis)
        run: bandit -c pyproject.toml -r src --severity-level medium

      # Audits the resolved dependency tree, so a CVE in a transitive package
      # fails the build rather than waiting to be noticed.
      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable --progress-spinner off
