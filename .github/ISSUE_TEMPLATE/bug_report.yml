name: Bug report
description: Something behaves differently from what is documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a **security** problem? Please don't file it here — see
        [SECURITY.md](../blob/main/SECURITY.md) for private reporting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure JMI_... = ...
        2. Run `python -m jmi ...`
        3. Call `GET /api/v1/...`
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Redact any credentials before pasting.
      render: text

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "1.1.0, or the commit SHA"
    validations:
      required: true

  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.11", "3.12", "3.13", "other"]
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: How it is running
      placeholder: "local venv / Docker / Render / other"
