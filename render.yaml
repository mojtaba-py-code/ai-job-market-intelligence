# Render blueprint — free-tier live demo.
#
# The platform runs entirely on its light dependency set: no Postgres, Redis or
# ML wheels required. Search falls back to the built-in pure-Python TF-IDF
# backend, the database is SQLite, and `jmi seed` loads bundled offline demo
# postings so the dashboard, search and analytics all have data on first load.
#
# Deploy: push to GitHub, then in Render -> "New +" -> "Blueprint" and pick this
# repo. JMI_SECRET_KEY / admin password are generated automatically.
services:
  - type: web
    name: ai-job-market-intelligence
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: python -m jmi seed && uvicorn jmi.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: JMI_ENV
        value: production
      - key: JMI_DEBUG
        value: "false"
      - key: JMI_SECRET_KEY
        generateValue: true
      - key: JMI_DATABASE_URL
        value: sqlite:///./data/runtime/jmi.sqlite3
      # The demo's read-only endpoints are open to any origin, which is only
      # safe because credentialed cross-origin requests are switched off. With
      # credentials enabled, `*` would let any website read authenticated
      # responses on a visitor's behalf — Settings rejects that combination.
      - key: JMI_CORS_ORIGINS
        value: "*"
      - key: JMI_CORS_ALLOW_CREDENTIALS
        value: "false"
      # Render terminates TLS on one proxy in front of the service, so the
      # rate limiter can trust exactly one X-Forwarded-For hop.
      - key: JMI_TRUSTED_PROXY_HOPS
        value: "1"
      # Swagger UI is normally off in production; the demo re-enables it because
      # letting people explore the API is the entire point of the deployment.
      - key: JMI_DOCS_ENABLED
        value: "true"
      - key: JMI_ADMIN_EMAIL
        value: admin@example.com
      - key: JMI_ADMIN_PASSWORD
        generateValue: true
