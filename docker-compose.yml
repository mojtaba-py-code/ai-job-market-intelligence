services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jmi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jmi}
      POSTGRES_DB: jmi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmi"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JMI_ENV: production
      JMI_DEBUG: "false"
      JMI_SECRET_KEY: ${JMI_SECRET_KEY:?set a strong secret in your .env}
      JMI_DATABASE_URL: postgresql+psycopg://jmi:${POSTGRES_PASSWORD:-jmi}@db:5432/jmi
      JMI_REDIS_URL: redis://redis:6379/0
      JMI_API_PORT: "8000"
      JMI_CORS_ORIGINS: ${JMI_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    # Create schema + admin + demo data, then serve.
    command: >
      sh -c "python -m jmi seed &&
             uvicorn jmi.api.app:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
