# The database and cache are reachable only over the internal compose network.
# Publishing them would put a database — and an unauthenticated Redis, which is
# a full host compromise — on every interface of the Docker host, including the
# one facing whatever network the machine is on. To inspect them locally, use
# `docker compose exec db psql`, or add a mapping bound to 127.0.0.1 in a
# compose override file you do not commit.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jmi}
      # Required rather than defaulted: a database that comes up with a
      # guessable password is a real exposure, not a convenience.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jmi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jmi} -d ${POSTGRES_DB:-jmi}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JMI_ENV: production
      JMI_DEBUG: "false"
      JMI_SECRET_KEY: ${JMI_SECRET_KEY:?set a strong secret in your .env}
      JMI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jmi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jmi}
      JMI_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JMI_API_PORT: "8000"
      JMI_CORS_ORIGINS: ${JMI_CORS_ORIGINS:-http://localhost:3000}
      # `seed` below creates an admin-role account from these two values, so
      # both are mandatory: a placeholder here would publish an administrator
      # whose password is in this repository.
      JMI_ADMIN_EMAIL: ${JMI_ADMIN_EMAIL:?set the bootstrap admin email in your .env}
      JMI_ADMIN_PASSWORD: ${JMI_ADMIN_PASSWORD:?set a strong bootstrap admin password in your .env}
      # The api container is reached directly on the published port, so there is
      # no proxy to have rewritten X-Forwarded-For. Raise this to match if you
      # put an ingress in front.
      JMI_TRUSTED_PROXY_HOPS: "0"
    ports:
      # The API is the only service meant to be reachable from outside.
      - "8000:8000"
    # Create schema + admin + demo data, then serve.
    command: >
      sh -c "python -m jmi seed &&
             uvicorn jmi.api.app:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
