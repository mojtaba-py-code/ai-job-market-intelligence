[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jmi-platform"
version = "1.0.0"
description = "AI-Powered Job Market Intelligence Platform — multi-source ingestion, NLP skill extraction, semantic search, analytics and resume matching."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Karimi" }]
keywords = ["job-market", "web-scraping", "nlp", "fastapi", "analytics", "semantic-search"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "SQLAlchemy>=2.0",
    "email-validator>=2.1",
    "python-multipart>=0.0.31",
    "PyJWT>=2.13.0",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "APScheduler>=3.10",
    "structlog>=24.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Heavy / infrastructure extras. The platform runs without them (graceful
# fallbacks) and automatically upgrades its behaviour when they are installed.
semantic = ["sentence-transformers>=2.6", "faiss-cpu>=1.8", "numpy>=1.26"]
nlp = ["spacy>=3.7"]
postgres = ["psycopg[binary]>=3.1", "alembic>=1.13"]
tasks = ["celery>=5.3", "redis>=5.0"]
browser = ["playwright>=1.43"]
metrics = ["prometheus-client>=0.20"]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-python-dateutil",
]

[project.scripts]
jmi = "jmi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jmi = ["py.typed", "../../data/taxonomy/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["jmi"]
omit = ["*/__main__.py", "*/infrastructure/scheduler/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # (str, Enum) is intentional for ORM/Pydantic serialisation compat
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["jmi"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
plugins = []

[tool.bandit]
# Tests deliberately exercise weak inputs and assert on failure paths.
exclude_dirs = ["tests"]
